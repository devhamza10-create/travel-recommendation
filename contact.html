<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Recommendation | Contact Us</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Navigation Bar ===== -->
  <nav class="navbar">
    <div class="logo">Travel Recommendation</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search destination... (beach, temple, country)" />
      <button id="searchBtn">Search</button>
      <button id="clearBtn">Clear</button>
    </div>
  </nav>

  <div class="page-content">
    <section class="contact-info">
    <section>
       <h1>Contact Us</h1>
      <h2>Send Us a Message</h2>
      <form id="contactForm">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit">Send Message</button>
        <p id="formMsg"></p>
      </form>
    </section>
    <section class="contact-info">
      <h2>Get In Touch</h2>
      <p><strong>Email:</strong> info@travelrecommendation.com</p>
      <p><strong>Phone:</strong> +1 123 456 7890</p>
      <p><strong>Address:</strong> Miami, Florida, USA</p>
    </section>

  </div>

  <footer>
    &copy; 2026 Travel Recommendation. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
